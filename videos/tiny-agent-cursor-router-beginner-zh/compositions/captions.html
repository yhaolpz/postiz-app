<template id="captions-template" data-composition-id="captions" data-width="1080" data-height="1920">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>


<style data-brand-tokens>
      :root {
      --paper: #ECECEA;
      --paper-2: #FF5A4F;
      --ink: #111111;
      --ink-soft: #0A84FF;
      --grid: rgba(10, 132, 255, 0.10);
      --ink-faint: rgba(10, 132, 255, 0.18);
      --cap-ink: #111111;
      --cap-canvas: #ECECEA;
      --cap-accent: #0A84FF;
      --cap-accent-2: #FF5A4F;
      --font-display: "Newsreader", system-ui, serif;
      --font-body: "Hanken Grotesk", system-ui, sans-serif;
      --cap-band-top: 1600px;
      --cap-band-height: 320px;
      }
    </style>

<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* THE cream card — graph-paper grid behind the line + top/bottom 1.5px cobalt
     hairlines (cobalt's frame furniture), square corners, NO drop shadow */
  .caption-pill {
    position: relative;
    max-width: 78%;
    padding: 20px 44px 24px;
    background: var(--cap-canvas, #f0ebde);
    background-image:
      linear-gradient(
        to right,
        color-mix(in srgb, var(--cap-ink, #1f2be0) 10%, transparent) 1px,
        transparent 1px
      ),
      linear-gradient(
        to bottom,
        color-mix(in srgb, var(--cap-ink, #1f2be0) 10%, transparent) 1px,
        transparent 1px
      );
    background-size: 16px 16px;
    border-top: 1.5px solid var(--cap-ink, #1f2be0);
    border-bottom: 1.5px solid var(--cap-ink, #1f2be0);
    border-radius: 0;
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.1em 0.34em;
    font-family: sans-serif;
    font-weight: 400;
    font-size: clamp(40px, 4.4vw, 58px);
    line-height: 1.16;
    letter-spacing: -0.01em;
  }

  /* upcoming — faint cobalt, no block */
  .caption-word {
    display: inline-block;
    padding: 0 0.06em;
    color: color-mix(in srgb, var(--cap-ink, #1f2be0) 42%, var(--cap-canvas, #f0ebde));
  }
  /* current word — THE cobalt flat block (risograph knockout): a solid cobalt fill
     via box-shadow spread = a hard square block w/o layout shift, no blur; the cream
     paper reads on top */
  .caption-word.is-active {
    color: var(--cap-canvas, #f0ebde);
    background: var(--cap-ink, #1f2be0);
    box-shadow: 0 0 0 0.06em var(--cap-ink, #1f2be0);
  }
  /* already spoken — solid cobalt ink, block cleared */
  .caption-word.is-spoken {
    color: var(--cap-ink, #1f2be0);
    background: transparent;
    box-shadow: none;
  }

  /* optional per-word accents (dormant until a word-classer tags them) */
  /* brand / key term — Newsreader italic, cobalt's only display inflection */
  .caption-word.cap-brand {
    font-style: italic;
  }
  /* numerals / data — the body sans voice, slightly recessed */
  .caption-word.cap-num {
    font-family: monospace;
    color: color-mix(in srgb, var(--cap-ink, #1f2be0) 72%, var(--cap-canvas, #f0ebde));
  }
  /* emphasis — a cobalt hairline underline (no second hue; emphasis is the ink) */
  .caption-word.cap-cta {
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-decoration-color: var(--cap-accent, #5560e5);
    text-underline-offset: 0.1em;
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 92%;
    }
    .caption-line {
      font-size: clamp(34px, 5.4vw, 48px);
    }
  }
</style>

<div
  id="captions-root"
  data-composition-id="captions"
  data-timeline-locked
  data-start="0"
  data-duration="48.048"
  data-fps="30"
  data-width="1080"
  data-height="1920"
>
  <div class="caption-layer" aria-hidden="true">
    <div id="caption-stage" class="caption-stage"></div>
  </div>
</div>

<script>
  // captions.mjs injects the engine's scene-aware groups + real duration here.
  var GROUPS = [{"id":"caption-group-0","frame":1,"start":0.1,"end":4.01,"text":"AI 模型名字越来越多。 难道想用 Cursor 写代码，","words":[{"id":"caption-word-0-0","text":"AI 模型名字越来越多。","start":0.1,"end":2.078},{"id":"caption-word-0-1","text":"难道想用 Cursor 写代码，","start":2.028,"end":4.01}]},{"id":"caption-group-1","frame":1,"start":4.01,"end":6.677,"text":"还得先学会每个模型吗？ 不用。","words":[{"id":"caption-word-1-0","text":"还得先学会每个模型吗？","start":4.01,"end":5.567},{"id":"caption-word-1-1","text":"不用。","start":5.567,"end":6.557}]},{"id":"caption-group-2","frame":2,"start":6.724,"end":10.316,"text":"新上线的 Cursor Router， 中文可以理解成自动分流器。","words":[{"id":"caption-word-2-0","text":"新上线的 Cursor Router，","start":6.724,"end":8.788},{"id":"caption-word-2-1","text":"中文可以理解成自动分流器。","start":8.788,"end":10.366}]},{"id":"caption-group-3","frame":2,"start":10.316,"end":14.02,"text":"你把任务交给 Auto， 它先判断任务类型和复杂度，","words":[{"id":"caption-word-3-0","text":"你把任务交给 Auto，","start":10.316,"end":12.014},{"id":"caption-word-3-1","text":"它先判断任务类型和复杂度，","start":12.014,"end":14.02}]},{"id":"caption-group-4","frame":2,"start":14.02,"end":16.147,"text":"再把任务交给更合适的模型。","words":[{"id":"caption-word-4-0","text":"再把任务交给更合适的模型。","start":14.02,"end":16.027}]},{"id":"caption-group-5","frame":3,"start":16.18,"end":18.647,"text":"你只需要选一个目标。 智能优先，","words":[{"id":"caption-word-5-0","text":"你只需要选一个目标。","start":16.18,"end":17.86},{"id":"caption-word-5-1","text":"智能优先，","start":17.81,"end":18.647}]},{"id":"caption-group-6","frame":3,"start":18.647,"end":20.989,"text":"尽量用更强的模型； 平衡模式，","words":[{"id":"caption-word-6-0","text":"尽量用更强的模型；","start":18.647,"end":20.152},{"id":"caption-word-6-1","text":"平衡模式，","start":20.152,"end":20.989}]},{"id":"caption-group-7","frame":3,"start":20.989,"end":23.499,"text":"兼顾效果和日常使用； 成本优先，","words":[{"id":"caption-word-7-0","text":"兼顾效果和日常使用；","start":20.989,"end":22.662},{"id":"caption-word-7-1","text":"成本优先，","start":22.662,"end":23.499}]},{"id":"caption-group-8","frame":3,"start":23.499,"end":25.459,"text":"先控制 Token 支出。","words":[{"id":"caption-word-8-0","text":"先控制 Token 支出。","start":23.499,"end":25.339}]},{"id":"caption-group-9","frame":4,"start":25.492,"end":28.571,"text":"比如改一句文案， 没必要动用最贵的模型；","words":[{"id":"caption-word-9-0","text":"比如改一句文案，","start":25.492,"end":26.788},{"id":"caption-word-9-1","text":"没必要动用最贵的模型；","start":26.788,"end":28.571}]},{"id":"caption-group-10","frame":4,"start":28.571,"end":31.276,"text":"遇到复杂重构， 再让更强的模型上场。","words":[{"id":"caption-word-10-0","text":"遇到复杂重构，","start":28.571,"end":29.705},{"id":"caption-word-10-1","text":"再让更强的模型上场。","start":29.705,"end":31.326}]},{"id":"caption-group-11","frame":4,"start":31.276,"end":35.954,"text":"不过自动选择不等于永远最好， 成本优先也不等于免费。","words":[{"id":"caption-word-11-0","text":"不过自动选择不等于永远最好，","start":31.276,"end":33.828},{"id":"caption-word-11-1","text":"成本优先也不等于免费。","start":33.828,"end":35.834}]},{"id":"caption-group-12","frame":5,"start":35.98,"end":39.38,"text":"如果你是小白， 先选 Auto 里的平衡模式就够了。","words":[{"id":"caption-word-12-0","text":"如果你是小白，","start":35.98,"end":37.03},{"id":"caption-word-12-1","text":"先选 Auto 里的平衡模式就够了。","start":37.03,"end":39.43}]},{"id":"caption-group-13","frame":5,"start":39.38,"end":42.084,"text":"需要更强效果， 再切到智能优先；","words":[{"id":"caption-word-13-0","text":"需要更强效果，","start":39.38,"end":40.642},{"id":"caption-word-13-1","text":"再切到智能优先；","start":40.642,"end":42.084}]},{"id":"caption-group-14","frame":5,"start":42.084,"end":44.428,"text":"预算更敏感， 再试成本优先。","words":[{"id":"caption-word-14-0","text":"预算更敏感，","start":42.084,"end":43.166},{"id":"caption-word-14-1","text":"再试成本优先。","start":43.166,"end":44.428}]},{"id":"caption-group-15","frame":5,"start":44.428,"end":48.115,"text":"关注 Tiny Agent， 每天听懂一个 AI 新功能。","words":[{"id":"caption-word-15-0","text":"关注 Tiny Agent，","start":44.428,"end":46.212},{"id":"caption-word-15-1","text":"每天听懂一个 AI 新功能。","start":46.212,"end":47.995}]}];
  var DURATION = 48.048;

  (function () {
    var stage = document.getElementById("caption-stage");

    // build DOM: one .caption-group per group, .caption-word per word
    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      // group on/off — exactly one group visible at a time
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      // 3-state karaoke via className SETS — seek-safe (gsap.set applies on the
      // engine's frame-by-frame seek; .call callbacks would NOT fire).
      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start); // upcoming (also resets on reverse-seek)
        tl.set(el, { className: "caption-word is-active" }, at); // current
        tl.fromTo(el, { scale: 0.985 }, { scale: 1, duration: 0.1, ease: "power3.out" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt); // demote when next activates
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }
    });

    // full-span anchor so the sub-comp timeline spans the whole video
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
  })();
</script>

<style>
  .caption-line { line-height: 1.1 !important; }
</style>
</template>
