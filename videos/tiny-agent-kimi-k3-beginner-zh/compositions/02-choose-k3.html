<!doctype html>
<html lang="zh-CN">
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          color: #f5f4ef;
          font-family: sans-serif;
        }
        #root,
        #root * {
          box-sizing: border-box;
        }
        .ground {
          position: absolute;
          inset: 0;
          background: #101010;
        }
        .headline-stage {
          position: absolute;
          top: 120px;
          left: 70px;
          width: 940px;
          height: 230px;
        }
        .headline {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: flex-start;
          font-size: 108px;
          line-height: 1.04;
          font-weight: 900;
          letter-spacing: -0.06em;
        }
        .headline .accent {
          color: #8b7cff;
        }
        .headline-secondary {
          opacity: 0;
        }
        .screenshot-wrap {
          position: absolute;
          top: 355px;
          left: 70px;
          width: 940px;
          height: 930px;
          overflow: hidden;
          border-radius: 34px;
          background: #1e1e1e;
          box-shadow: 0 28px 70px rgba(16, 16, 16, 0.48);
          will-change: transform, opacity;
        }
        .screenshot {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: 73% 52%;
          will-change: transform;
        }
      </style>

      <div
        id="root"
        data-composition-id="choose-k3"
        data-duration="6.144"
        data-width="1080"
        data-height="1920"
      >
        <div class="ground"></div>
        <div class="headline-stage" data-primary-role="headline">
          <div id="choose-k3-fast" class="headline">
            查资料，用<span class="accent">快速</span>
          </div>
          <div id="choose-k3-complex" class="headline headline-secondary">
            连续干活，选 <span class="accent">K3</span>
          </div>
        </div>
        <div
          id="choose-k3-screenshot-wrap"
          class="screenshot-wrap"
          data-primary-role="real-screenshot"
        >
          <img
            id="choose-k3-screenshot"
            class="screenshot"
            data-asset-kind="product-screenshot"
            data-layout-allow-overflow
            src=".media/images/image_001.png"
            alt="Kimi model picker"
          />
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        tl.fromTo(
          "#choose-k3-fast",
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.38, ease: "power4.out" },
          0.15
        );
        tl.fromTo(
          "#choose-k3-screenshot-wrap",
          { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.52, ease: "expo.out" },
          0.26
        );
        tl.fromTo(
          "#choose-k3-screenshot",
          { scale: 1 },
          { scale: 1.055, duration: 5.75, ease: "none" },
          0.35
        );
        tl.to(
          "#choose-k3-fast",
          { opacity: 0, y: -18, duration: 0.22, ease: "power2.in" },
          2.08
        );
        tl.fromTo(
          "#choose-k3-complex",
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.34, ease: "power4.out" },
          2.28
        );
        window.__timelines["choose-k3"] = tl;
      </script>
    </template>
  </body>
</html>
