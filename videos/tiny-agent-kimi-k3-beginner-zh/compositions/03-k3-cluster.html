<!doctype html>
<html lang="zh-CN">
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          color: #f5f4ef;
          font-family: sans-serif;
        }
        #root,
        #root * {
          box-sizing: border-box;
        }
        .ground {
          position: absolute;
          inset: 0;
          background: #101010;
        }
        .headline {
          position: absolute;
          top: 120px;
          left: 70px;
          width: 940px;
          font-size: 104px;
          line-height: 1.05;
          font-weight: 900;
          letter-spacing: -0.06em;
        }
        .headline strong {
          color: #8b7cff;
          font-weight: 900;
        }
        .screenshot-wrap {
          position: absolute;
          top: 355px;
          left: 70px;
          width: 940px;
          height: 930px;
          overflow: hidden;
          border-radius: 34px;
          background: #1e1e1e;
          box-shadow: 0 28px 70px rgba(16, 16, 16, 0.48);
          will-change: transform, opacity;
        }
        .screenshot {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: 73% 66%;
          will-change: transform;
        }
      </style>

      <div
        id="root"
        data-composition-id="k3-cluster"
        data-duration="5.784"
        data-width="1080"
        data-height="1920"
      >
        <div class="ground"></div>
        <div id="k3-cluster-headline" class="headline" data-primary-role="headline">
          很多文件，才用 <strong>K3 集群</strong>
        </div>
        <div
          id="k3-cluster-screenshot-wrap"
          class="screenshot-wrap"
          data-primary-role="real-screenshot"
        >
          <img
            id="k3-cluster-screenshot"
            class="screenshot"
            data-asset-kind="product-screenshot"
            data-layout-allow-overflow
            src=".media/images/image_001.png"
            alt="Kimi K3 cluster option"
          />
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        tl.fromTo(
          "#k3-cluster-headline",
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.42, ease: "power4.out" },
          0.15
        );
        tl.fromTo(
          "#k3-cluster-screenshot-wrap",
          { opacity: 0, y: 34 },
          { opacity: 1, y: 0, duration: 0.55, ease: "expo.out" },
          0.3
        );
        tl.fromTo(
          "#k3-cluster-screenshot",
          { scale: 1 },
          { scale: 1.06, duration: 5.35, ease: "none" },
          0.4
        );
        window.__timelines["k3-cluster"] = tl;
      </script>
    </template>
  </body>
</html>
